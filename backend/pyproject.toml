[project]
name = "mini-siem"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]  # S = bandit güvenlik kontrolleri

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # testlerde assert serbest
